name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - phase-public-site-rebuild
  push:
    branches:
      - main
      - phase-public-site-rebuild

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      database: ${{ steps.plan.outputs.database }}
      browser: ${{ steps.plan.outputs.browser }}
      mode: ${{ steps.plan.outputs.mode }}
      tests: ${{ steps.plan.outputs.tests }}
      crossBrowser: ${{ steps.plan.outputs.crossBrowser }}
      visual: ${{ steps.plan.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and calculate impact plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT: ${{ github.event_name }}
          CI_TARGET: ${{ github.base_ref || github.ref_name }}
          CI_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --test scripts/test-ci-plan.mjs
          node scripts/ci-plan.mjs

  fast:
    needs: plan
    if: needs.plan.outputs.app == 'true' && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amaana?schema=public
      NEXT_PUBLIC_APP_URL: https://amaanafoundation.org
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Audit global CSS architecture
        run: node scripts/audit-global-css.mjs
      - name: Verify branded application icons
        run: npm run icons:verify
      - name: Decode and validate public campaign media
        run: |
          node --test scripts/test-public-media.mjs
          node scripts/check-public-media.mjs
          node --test scripts/test-public-media-review-register.mjs
          node scripts/check-public-media-review-register.mjs
      - name: Validate launch readiness register
        run: |
          node --test scripts/test-launch-readiness.mjs
          node --test scripts/test-production-environment.mjs
          node scripts/check-launch-readiness.mjs
      - name: Verify non-destructive campaign import
        run: node --test scripts/test-reviewed-campaigns.mjs scripts/test-reviewed-campaign-revisions.mjs scripts/test-reviewed-campaign-feature-normalization.mjs scripts/test-reviewed-campaign-video-normalization.mjs
      - name: Verify canonical factual locks
        run: |
          npm run master:check
          node --test scripts/test-canonical-factual-locks.mjs
      - name: Guard public editorial and compliance copy
        run: |
          node --test scripts/test-public-editorial-consistency.mjs
          node scripts/check-public-editorial-consistency.mjs
      - name: Guard public/private data boundaries
        run: node --test scripts/test-public-data-boundaries.mjs
      - name: Verify archive filters
        run: node --experimental-strip-types --test scripts/test-work-filters.mjs
      - name: Verify daily readings, reminder windows and local calendar boundaries
        run: node --experimental-strip-types --test scripts/test-daily-companion.mjs scripts/test-daily-companion-api.mjs

      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run lint
      - run: npm run typecheck

      - name: Run fast test suite for pull requests
        if: github.event_name == 'pull_request'
        run: npm test

      - name: Run coverage suite for integration pushes
        if: github.event_name != 'pull_request'
        run: npm run test:coverage



  database:
    needs: [plan, fast]
    if: needs.plan.outputs.database == 'true' && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amaana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amaana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amaana?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Verify refund ledger against isolated PostgreSQL
        env:
          AMAANA_DATABASE_TESTS: "true"
        run: |
          npx prisma migrate deploy
          node scripts/test-refund-ledger-migration.mjs
          node scripts/test-home-carousel-migration.mjs
          npx vitest run src/app/api/webhooks/razorpay/route.database.test.ts


  production:
    needs: [plan, fast]
    if: needs.plan.outputs.app == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amaana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amaana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amaana?schema=public
      NEXT_PUBLIC_APP_URL: https://amaanafoundation.org
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run prisma:generate
      - name: Prepare isolated production-build database
        if: github.event_name != 'pull_request'
        run: npx prisma migrate deploy
      - name: Build production application
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Enforce production bundle budgets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          JS_BYTES=$(find .next/static -type f -name '*.js' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          CSS_BYTES=$(find .next/static -type f -name '*.css' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          JS_BUDGET=$((800 * 1024))
          # Aggregate static CSS grew with the audited documentary/editorial system,
          # route-scoped carousels, guided forms and accessibility refinements.
          # Keep a tight regression cap while route-level delivery/CLS tests protect user payload.
          CSS_BUDGET=$((340 * 1024))
          echo "Built static JavaScript: ${JS_BYTES} bytes (budget ${JS_BUDGET})"
          echo "Built static CSS: ${CSS_BYTES} bytes (budget ${CSS_BUDGET})"
          test "$JS_BYTES" -le "$JS_BUDGET"
          test "$CSS_BYTES" -le "$CSS_BUDGET"

      - name: Run post-build server smoke checks
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cleanup_server() {
            if [ -n "${SERVER_PID:-}" ]; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            fuser -k 3000/tcp 2>/dev/null || true
          }
          assert_fixture_hidden() {
            local path="$1"
            local marker="$2"
            local output="$3"
            local status
            status=$(curl --silent --show-error --output "$output" --write-out '%{http_code}' "http://127.0.0.1:3000${path}")
            if [ "$status" -ge 500 ]; then exit 1; fi
            if grep -q "$marker" "$output"; then exit 1; fi
          }
          npm run start > /tmp/amaana-next.log 2>&1 &
          SERVER_PID=$!
          trap cleanup_server EXIT
          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live > /tmp/health.json; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/amaana-next.log; exit 1; fi
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:3000/about > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/request-assistance > /dev/null
          assert_fixture_hidden "/browser-acceptance/donation" "Mocked donation journey" "/tmp/donation-acceptance.html"
          assert_fixture_hidden "/browser-acceptance/admin?profile=full" "Synthetic operations console" "/tmp/admin-acceptance.html"
          curl --fail --silent --show-error -D /tmp/health.headers -o /dev/null http://127.0.0.1:3000/api/health/live
          tr -d '\r' < /tmp/health.headers > /tmp/health.normalized
          grep -qi '^cache-control: .*no-store' /tmp/health.normalized
          grep -qi '^x-content-type-options: nosniff$' /tmp/health.normalized
          grep -qi '^x-frame-options: DENY$' /tmp/health.normalized
          curl --fail --silent --show-error -D /tmp/assistance.headers -o /dev/null http://127.0.0.1:3000/request-assistance
          tr -d '\r' < /tmp/assistance.headers > /tmp/assistance.normalized
          grep -qi '^cache-control: .*no-store' /tmp/assistance.normalized
          cleanup_server
          trap - EXIT
          if fuser 3000/tcp >/dev/null 2>&1; then exit 1; fi


  browser:
    needs: [plan, fast]
    if: needs.plan.outputs.browser == 'true' && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    # Expanded all-route captures retain a bounded full-suite allowance.
    timeout-minutes: ${{ needs.plan.outputs.mode == 'full' && 35 || 20 }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amaana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amaana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amaana?schema=public
      NEXT_PUBLIC_APP_URL: https://amaanafoundation.org
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run prisma:generate
      - name: Prepare browser acceptance database
        if: needs.plan.outputs.browser == 'true'
        run: |
          npx prisma migrate deploy
          npm run seed:public-content
          node --input-type=module - <<'JS'
          import { PrismaClient } from '@prisma/client';
          import { applyMasterContent } from './prisma/apply-master-content.mjs';
          const prisma = new PrismaClient();
          try { await applyMasterContent(prisma); } finally { await prisma.$disconnect(); }
          JS

      - name: Build isolated browser acceptance fixture
        if: needs.plan.outputs.browser == 'true'
        shell: bash
        env:
          AMAANA_BROWSER_ACCEPTANCE: "true"
        run: |
          set -euo pipefail
          rm -rf .next
          npm run build

      - name: Prepare isolated browser acceptance workspace
        if: needs.plan.outputs.browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_DIR="$GITHUB_WORKSPACE/amaana-browser-acceptance"
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cp -R e2e "$BROWSER_DIR/e2e"
          cp playwright.config.mjs "$BROWSER_DIR/playwright.config.mjs"
          cp playwright.cross-browser.config.mjs "$BROWSER_DIR/playwright.cross-browser.config.mjs"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null
          npm install --save-dev --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Verify pinned preinstalled browser runtime
        shell: bash
        run: |
          set -euo pipefail
          # Firefox requires its existing home directory to belong to the runner user.
          chown "$(id -u):$(id -g)" "$HOME"
          cd "$GITHUB_WORKSPACE/amaana-browser-acceptance"
          node - <<'JS'
          const { chromium, firefox, webkit } = require('@playwright/test');
          const fs = require('node:fs');
          for (const browser of [chromium, firefox, webkit]) {
            if (!fs.existsSync(browser.executablePath())) throw new Error(`Missing pinned browser: ${browser.name()}`);
          }
          JS

      - name: Run responsive, accessibility and journey browser acceptance
        if: needs.plan.outputs.browser == 'true'
        shell: bash
        env:
          CI_BROWSER_TESTS: ${{ needs.plan.outputs.tests }}
          AMAANA_APP_WORKSPACE: ${{ github.workspace }}
          AMAANA_FULL_VISUAL_REVIEW: ${{ needs.plan.outputs.visual }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/amaana-browser-acceptance"
          if [ -n "$CI_BROWSER_TESTS" ]; then
            read -r -a SELECTED_TESTS <<< "$CI_BROWSER_TESTS"
            npx playwright test --config=playwright.config.mjs "${SELECTED_TESTS[@]}"
          else
            npx playwright test --config=playwright.config.mjs
          fi

      - name: Run Firefox and WebKit public-surface smoke
        if: needs.plan.outputs.crossBrowser == 'true'
        shell: bash
        env:
          AMAANA_APP_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/amaana-browser-acceptance"
          npx playwright test --config=playwright.cross-browser.config.mjs

      - name: Upload launch review screenshots
        if: always() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launch-review-screenshots-${{ github.sha }}
          path: |
            amaana-browser-acceptance/launch-review
            amaana-browser-acceptance/test-results
            amaana-browser-acceptance/playwright-report
          if-no-files-found: warn
          retention-days: 7


      - name: Upload mobile site audit captures
        if: always() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-mobile-${{ github.sha }}
          path: amaana-browser-acceptance/site-audit/mobile
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload desktop site audit captures
        if: always() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-desktop-${{ github.sha }}
          path: amaana-browser-acceptance/site-audit/desktop
          if-no-files-found: ignore
          retention-days: 7


  verify:
    if: always()
    needs: [plan, fast, database, production, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          PLAN: ${{ needs.plan.result }}
          FAST: ${{ needs.fast.result }}
          DATABASE: ${{ needs.database.result }}
          PRODUCTION: ${{ needs.production.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$PLAN" = success
          for result in "$FAST" "$DATABASE" "$PRODUCTION" "$BROWSER"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done


  production-promotion-readiness:
    name: Production promotion readiness
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate launch-readiness register structure
        run: node scripts/check-launch-readiness.mjs

      - name: Keep draft promotion advisory and fail closed when ready
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Draft production-promotion PR: readiness remains advisory."
            echo "Marking this PR Ready for Review will require every production gate to be VERIFIED or NOT_APPLICABLE."
            node scripts/check-launch-readiness.mjs --production || true
            exit 0
          fi

          echo "Production-promotion PR is Ready for Review; enforcing fail-closed production readiness."
          node scripts/check-launch-readiness.mjs --production

