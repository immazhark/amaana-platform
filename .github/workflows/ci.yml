name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "build/**"
      - phase-public-site-rebuild

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amaana?schema=public
      NEXT_PUBLIC_APP_URL: https://amaanafoundation.org
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit global CSS architecture
        run: node scripts/audit-global-css.mjs
      - name: Decode and validate public campaign media
        run: |
          node --test scripts/test-public-media.mjs
          node scripts/check-public-media.mjs
          node --test scripts/test-public-media-review-register.mjs
          node scripts/check-public-media-review-register.mjs
      - name: Verify non-destructive campaign import
        run: node --test scripts/test-reviewed-campaigns.mjs scripts/test-reviewed-campaign-revisions.mjs scripts/test-reviewed-campaign-feature-normalization.mjs scripts/test-reviewed-campaign-video-normalization.mjs
      - name: Verify canonical factual locks
        run: node --test scripts/test-canonical-factual-locks.mjs
      - name: Verify archive filters
        run: node --experimental-strip-types --test scripts/test-work-filters.mjs
      - name: Verify daily readings, reminder windows and local calendar boundaries
        run: node --experimental-strip-types --test scripts/test-daily-companion.mjs scripts/test-daily-companion-api.mjs
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Enforce production bundle budgets
        shell: bash
        run: |
          set -euo pipefail
          JS_BYTES=$(find .next/static -type f -name '*.js' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          CSS_BYTES=$(find .next/static -type f -name '*.css' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          JS_BUDGET=$((800 * 1024))
          # The canonical-content/public-site expansion now builds ~261 KiB of CSS.
          # Keep a narrow regression ceiling instead of weakening the gate broadly.
          CSS_BUDGET=$((272 * 1024))

          echo "Built static JavaScript: ${JS_BYTES} bytes (budget ${JS_BUDGET})"
          echo "Built static CSS: ${CSS_BYTES} bytes (budget ${CSS_BUDGET})"

          if [ "$JS_BYTES" -gt "$JS_BUDGET" ]; then
            echo "JavaScript bundle budget exceeded."
            exit 1
          fi
          if [ "$CSS_BYTES" -gt "$CSS_BUDGET" ]; then
            echo "CSS bundle budget exceeded."
            exit 1
          fi
      - name: Run post-build server smoke checks
        shell: bash
        run: |
          set -euo pipefail

          cleanup_server() {
            if [ -n "${SERVER_PID:-}" ]; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            # npm/Next may leave a child next-server alive after the wrapper exits.
            # Port 3000 belongs only to this runner-owned smoke server at this point.
            fuser -k 3000/tcp 2>/dev/null || true
          }

          assert_fixture_hidden() {
            local path="$1"
            local marker="$2"
            local output="$3"
            local status
            status=$(curl --silent --show-error --output "$output" --write-out '%{http_code}' "http://127.0.0.1:3000${path}")
            if [ "$status" -ge 500 ]; then
              echo "Browser acceptance fixture ${path} returned an unexpected server error: HTTP ${status}."
              exit 1
            fi
            if grep -q "$marker" "$output"; then
              echo "Browser acceptance fixture content at ${path} was exposed outside the isolated Playwright server."
              exit 1
            fi
          }

          npm run start > /tmp/amaana-next.log 2>&1 &
          SERVER_PID=$!
          trap cleanup_server EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live > /tmp/health.json; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/amaana-next.log
            exit 1
          fi

          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:3000/about > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/request-assistance > /dev/null

          # Next.js may stream a notFound() response with HTTP 200 after headers are committed.
          # The security property is that normal runtime can never render synthetic fixture content.
          assert_fixture_hidden "/browser-acceptance/donation" "Mocked donation journey" "/tmp/donation-acceptance.html"
          assert_fixture_hidden "/browser-acceptance/admin?profile=full" "Synthetic operations console" "/tmp/admin-acceptance.html"

          curl --fail --silent --show-error -D /tmp/health.headers -o /dev/null http://127.0.0.1:3000/api/health/live
          tr -d '\r' < /tmp/health.headers > /tmp/health.normalized
          grep -qi '^cache-control: .*no-store' /tmp/health.normalized
          grep -qi '^x-content-type-options: nosniff$' /tmp/health.normalized
          grep -qi '^x-frame-options: DENY$' /tmp/health.normalized

          curl --fail --silent --show-error -D /tmp/assistance.headers -o /dev/null http://127.0.0.1:3000/request-assistance
          tr -d '\r' < /tmp/assistance.headers > /tmp/assistance.normalized
          grep -qi '^cache-control: .*no-store' /tmp/assistance.normalized

          cleanup_server
          trap - EXIT

          # Fail here if the smoke server still owns the port; Playwright must start a fresh flagged server.
          if fuser 3000/tcp >/dev/null 2>&1; then
            echo "Smoke server still owns port 3000 after cleanup."
            exit 1
          fi
      - name: Build isolated browser acceptance fixture
        shell: bash
        env:
          AMAANA_BROWSER_ACCEPTANCE: "true"
        run: |
          set -euo pipefail
          rm -rf .next
          npm run build
      - name: Prepare isolated browser acceptance workspace
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_DIR="$RUNNER_TEMP/amaana-browser-acceptance"
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cp -R e2e "$BROWSER_DIR/e2e"
          cp playwright.config.mjs "$BROWSER_DIR/playwright.config.mjs"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null
          npm install --save-dev --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium for browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/amaana-browser-acceptance"
          npx playwright install --with-deps chromium
      - name: Run responsive, accessibility and journey browser acceptance
        shell: bash
        env:
          AMAANA_APP_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/amaana-browser-acceptance"
          npx playwright test --config=playwright.config.mjs
