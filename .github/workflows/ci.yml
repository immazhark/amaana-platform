name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "build/**"
      - phase-public-site-rebuild

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amaana?schema=public
      NEXT_PUBLIC_APP_URL: https://amaanafoundation.org
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
